<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="feed1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdb60c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#feed1Grad)" />
  <!-- Abstract geometric pattern -->
  <circle cx="700" cy="100" r="180" fill="#fdb60c" opacity="0.1" />
  <circle cx="100" cy="500" r="140" fill="#fdb60c" opacity="0.08" />

  <!-- Coffee cup / Artisanal beverage mockup -->
  <g transform="translate(480, 260)">
    <ellipse cx="0" cy="180" rx="140" ry="24" fill="#000000" opacity="0.4" />
    <!-- Tumbler / cup body -->
    <path d="M -70 -120 L 70 -120 L 50 160 L -50 160 Z" fill="#2d2d2d" stroke="#fdb60c" stroke-width="2" />
    <!-- Cup sleeve -->
    <path d="M -63 -30 L 63 -30 L 55 70 L -55 70 Z" fill="url(#goldAccent)" />
    <!-- Cup logo -->
    <circle cx="0" cy="20" r="32" fill="#1e1e1e" />
    <text x="0" y="26" font-family="'Poppins', sans-serif" font-size="16" font-weight="900" fill="#fdb60c" text-anchor="middle">IK</text>
    <text x="0" y="44" font-family="'Montserrat', sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">ROASTERY</text>
    <!-- Cup lid -->
    <rect x="-76" y="-140" width="152" height="24" rx="12" fill="#3a3a3a" />
    <rect x="-30" y="-152" width="60" height="14" rx="4" fill="#222222" />
  </g>

  <!-- Typography & Copy Content -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="url(#goldAccent)" />
    <text x="70" y="21" font-family="'Poppins', sans-serif" font-size="13" font-weight="bold" fill="#1e1e1e" text-anchor="middle">SPECIAL EDITION</text>
    
    <text x="0" y="90" font-family="'Poppins', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">ARABICA</text>
    <text x="0" y="145" font-family="'Poppins', sans-serif" font-size="52" font-weight="900" fill="#fdb60c" letter-spacing="-1">PREMIUM</text>

    <text x="0" y="195" font-family="'Montserrat', sans-serif" font-size="16" fill="#a0a0a0">Nikmati aroma biji kopi pilihan terbaik.</text>
    <text x="0" y="222" font-family="'Montserrat', sans-serif" font-size="16" fill="#a0a0a0">Cita rasa autentik untuk menemani harimu.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="180" height="50" rx="25" fill="#ffffff" />
      <text x="90" y="32" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#1e1e1e" text-anchor="middle">Order Sekarang</text>
    </g>
  </g>
</svg>
