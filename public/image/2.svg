<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 625" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef8e8" />
      <stop offset="100%" stop-color="#faecc5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f4f4" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#222222" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="625" rx="30" fill="url(#bgGrad)" />

  <!-- Geometric Abstract background accents -->
  <circle cx="420" cy="120" r="80" fill="#fdb60c" opacity="0.3" />
  <circle cx="70" cy="480" r="110" fill="#fdb60c" opacity="0.25" />
  <rect x="360" y="320" width="120" height="120" rx="24" fill="#222222" opacity="0.06" transform="rotate(25 420 380)" />

  <!-- Avatar card frame -->
  <g filter="url(#softShadow)">
    <rect x="50" y="50" width="400" height="525" rx="24" fill="url(#cardGrad)" />
    
    <!-- Pattern dots inside card -->
    <g opacity="0.12" fill="#222222">
      <circle cx="80" cy="80" r="3" /><circle cx="100" cy="80" r="3" /><circle cx="120" cy="80" r="3" />
      <circle cx="80" cy="100" r="3" /><circle cx="100" cy="100" r="3" /><circle cx="120" cy="100" r="3" />
      <circle cx="80" cy="120" r="3" /><circle cx="100" cy="120" r="3" /><circle cx="120" cy="120" r="3" />
    </g>

    <!-- Circular Profile Portal -->
    <circle cx="250" cy="240" r="130" fill="#fdb60c" />
    <circle cx="250" cy="240" r="122" fill="#222222" />

    <!-- Designer Portrait Character -->
    <clipPath id="avatarClip">
      <circle cx="250" cy="240" r="122" />
    </clipPath>

    <g clip-path="url(#avatarClip)">
      <!-- Shoulders & Outfit -->
      <path d="M140 370 Q 250 330 360 370 L370 420 L130 420 Z" fill="#333333" />
      <polygon points="250,335 230,370 270,370" fill="#fdb60c" />
      <polygon points="250,355 242,390 258,390" fill="#ffffff" />

      <!-- Neck -->
      <rect x="228" y="270" width="44" height="60" rx="8" fill="#e8b99b" />
      
      <!-- Head -->
      <ellipse cx="250" cy="225" rx="55" ry="65" fill="#f5cbb1" />
      <!-- Ears -->
      <circle cx="195" cy="225" r="12" fill="#e8b99b" />
      <circle cx="305" cy="225" r="12" fill="#e8b99b" />

      <!-- Hair modern crop -->
      <path d="M190 200 C 190 140, 310 140, 310 200 C 310 170, 270 155, 230 160 C 205 165, 192 180, 190 200 Z" fill="#1e1e1e" />

      <!-- Modern Glasses -->
      <rect x="210" y="210" width="34" height="24" rx="6" fill="none" stroke="#fdb60c" stroke-width="4" />
      <rect x="256" y="210" width="34" height="24" rx="6" fill="none" stroke="#fdb60c" stroke-width="4" />
      <line x1="244" y1="222" x2="256" y2="222" stroke="#fdb60c" stroke-width="4" />

      <!-- Eyes & Smile -->
      <circle cx="227" cy="222" r="4" fill="#222222" />
      <circle cx="273" cy="222" r="4" fill="#222222" />
      <path d="M236 252 Q 250 264 264 252" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round" />
    </g>

    <!-- Professional badge overlay -->
    <rect x="80" y="420" width="340" height="120" rx="16" fill="#ffffff" stroke="#f0f0f0" stroke-width="1" />
    <text x="250" y="455" font-family="'Poppins', sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">Ibnu Khanif</text>
    <text x="250" y="480" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" fill="#fdb60c" text-anchor="middle">Professional Graphic Designer</text>
    
    <!-- Mini pill tags -->
    <g transform="translate(100, 498)">
      <rect x="0" y="0" width="85" height="26" rx="13" fill="#fff9e6" />
      <text x="42" y="17" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fdb60c" text-anchor="middle">Branding</text>

      <rect x="95" y="0" width="115" height="26" rx="13" fill="#fff9e6" />
      <text x="152" y="17" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fdb60c" text-anchor="middle">Social Media</text>

      <rect x="220" y="0" width="80" height="26" rx="13" fill="#fff9e6" />
      <text x="260" y="17" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fdb60c" text-anchor="middle">Cetak</text>
    </g>
  </g>
</svg>
