<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#skinGrad)" />
  <circle cx="560" cy="300" r="180" fill="#fdb60c" opacity="0.3" />

  <!-- Serum Bottle Vector Mockup -->
  <g transform="translate(560, 310)">
    <ellipse cx="0" cy="130" rx="90" ry="20" fill="#e11d48" opacity="0.1" />
    <!-- Dropper -->
    <rect x="-14" y="-120" width="28" height="35" rx="8" fill="#ffffff" />
    <rect x="-24" y="-85" width="48" height="20" rx="6" fill="#fdb60c" />
    <!-- Glass Bottle -->
    <rect x="-45" y="-65" width="90" height="180" rx="20" fill="#ffffff" stroke="#fdb60c" stroke-width="2" />
    <!-- Label -->
    <rect x="-35" y="-20" width="70" height="90" rx="8" fill="#fef08a" />
    <text x="0" y="20" font-family="'Poppins', sans-serif" font-size="12" font-weight="900" fill="#222222" text-anchor="middle">GLOW</text>
    <text x="0" y="38" font-family="'Montserrat', sans-serif" font-size="8" font-weight="bold" fill="#f59e0b" text-anchor="middle">SERUM</text>
  </g>

  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="140" height="30" rx="15" fill="#fdb60c" />
    <text x="70" y="20" font-family="'Poppins', sans-serif" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">NATURAL GLOW</text>
    
    <text x="0" y="90" font-family="'Poppins', sans-serif" font-size="52" font-weight="900" fill="#222222" letter-spacing="-1">ORGANIC</text>
    <text x="0" y="145" font-family="'Poppins', sans-serif" font-size="52" font-weight="900" fill="#fdb60c" letter-spacing="-1">SKINCARE</text>

    <text x="0" y="195" font-family="'Montserrat', sans-serif" font-size="16" fill="#4b5563">Formula lembut mencerahkan dan menjaga elastisitas kulit.</text>
    <text x="0" y="222" font-family="'Montserrat', sans-serif" font-size="16" font-weight="bold" fill="#222222">100% Bahan Alami Teruji Klinis.</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="180" height="50" rx="25" fill="#222222" />
      <text x="90" y="32" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Coba Sekarang</text>
    </g>
  </g>
</svg>
