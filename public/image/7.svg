<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#222222" />
  <circle cx="400" cy="300" r="240" fill="#fdb60c" opacity="0.15" />

  <!-- Can & Bottle Product Label Mockup -->
  <g transform="translate(400, 290)">
    <!-- Can cylinder -->
    <rect x="-140" y="-170" width="280" height="340" rx="20" fill="url(#labelGrad)" stroke="#fdb60c" stroke-width="4" />
    <!-- Can top rim -->
    <ellipse cx="0" cy="-170" rx="140" ry="24" fill="#e5e7eb" stroke="#9ca3af" stroke-width="3" />
    <ellipse cx="0" cy="-170" rx="120" ry="18" fill="#d1d5db" />
    <!-- Pull tab -->
    <ellipse cx="0" cy="-170" rx="25" ry="12" fill="#9ca3af" />

    <!-- Label graphics -->
    <rect x="-130" y="-120" width="260" height="260" fill="#ffffff" rx="12" />
    <circle cx="0" cy="-40" r="45" fill="#fdb60c" />
    <path d="M-20 -35 L 0 -65 L 20 -35 Z" fill="#222222" />
    <text x="0" y="25" font-family="'Poppins', sans-serif" font-size="24" font-weight="900" fill="#222222" text-anchor="middle">LEMON TEA</text>
    <text x="0" y="50" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">100% FRESH EXTRACT</text>
    <rect x="-80" y="75" width="160" height="28" rx="14" fill="#222222" />
    <text x="0" y="94" font-family="'Poppins', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">NETTO 250 ML</text>
  </g>
</svg>
