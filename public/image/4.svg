<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="feed2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8" />
      <stop offset="100%" stop-color="#f5e4b2" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#feed2Grad)" />
  <!-- Fashion Graphic Style -->
  <circle cx="560" cy="300" r="210" fill="#222222" />
  <circle cx="560" cy="300" r="195" fill="#fdb60c" />

  <!-- Sneaker / Fashion Illustration -->
  <g transform="translate(560, 310)">
    <!-- Shadow -->
    <ellipse cx="0" cy="110" rx="150" ry="25" fill="#222222" opacity="0.3" />
    <!-- Shoe vector silhouette -->
    <path d="M -130 50 C -120 10, -80 -10, -30 -10 C 20 -10, 50 10, 80 10 C 110 10, 130 40, 140 70 L 140 90 L -130 90 Z" fill="#222222" />
    <path d="M -135 75 L 145 75 L 145 95 L -135 95 Z" fill="#ffffff" />
    <!-- Accent line -->
    <path d="M -90 40 Q -10 15 60 45" stroke="#fdb60c" stroke-width="12" fill="none" stroke-linecap="round" />
    <circle cx="95" cy="45" r="8" fill="#ffffff" />
  </g>

  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="#222222" />
    <text x="65" y="20" font-family="'Poppins', sans-serif" font-size="12" font-weight="bold" fill="#fdb60c" text-anchor="middle">NEW ARRIVAL</text>
    
    <text x="0" y="90" font-family="'Poppins', sans-serif" font-size="52" font-weight="900" fill="#222222" letter-spacing="-1">STREETWEAR</text>
    <text x="0" y="145" font-family="'Poppins', sans-serif" font-size="52" font-weight="900" fill="#fdb60c" letter-spacing="-1">COLLECTION</text>

    <text x="0" y="195" font-family="'Montserrat', sans-serif" font-size="16" font-weight="500" fill="#555555">Tampil percaya diri dengan gaya urban terkini.</text>
    <text x="0" y="222" font-family="'Montserrat', sans-serif" font-size="16" font-weight="bold" fill="#222222">Diskon hingga 50% untuk member baru!</text>

    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="180" height="50" rx="25" fill="#222222" />
      <text x="90" y="32" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Belanja Sekarang</text>
    </g>
  </g>
</svg>
