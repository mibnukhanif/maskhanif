<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="mktGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee4d2d" />
      <stop offset="100%" stop-color="#ff7337" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#mktGrad1)" />
  <!-- Abstract burst rays -->
  <g opacity="0.15">
    <polygon points="400,300 0,0 80,0" fill="#ffffff" />
    <polygon points="400,300 200,0 280,0" fill="#ffffff" />
    <polygon points="400,300 400,0 480,0" fill="#ffffff" />
    <polygon points="400,300 600,0 680,0" fill="#ffffff" />
    <polygon points="400,300 800,0 800,80" fill="#ffffff" />
    <polygon points="400,300 800,200 800,280" fill="#ffffff" />
  </g>

  <!-- Marketplace sale banner elements -->
  <g transform="translate(400, 220)">
    <rect x="-180" y="-80" width="360" height="40" rx="20" fill="#fdb60c" />
    <text x="0" y="-54" font-family="'Poppins', sans-serif" font-size="18" font-weight="900" fill="#222222" text-anchor="middle">OFFICIAL STORE BANNER</text>

    <text x="0" y="40" font-family="'Poppins', sans-serif" font-size="70" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">MEGA SALE</text>
    <text x="0" y="110" font-family="'Poppins', sans-serif" font-size="64" font-weight="900" fill="#fdb60c" text-anchor="middle">DISKON 70%</text>

    <!-- Badges -->
    <g transform="translate(-140, 160)">
      <rect x="0" y="0" width="130" height="42" rx="10" fill="#ffffff" />
      <text x="65" y="27" font-family="'Poppins', sans-serif" font-size="14" font-weight="bold" fill="#ee4d2d" text-anchor="middle">GRATIS ONGKIR</text>
    </g>
    <g transform="translate(10, 160)">
      <rect x="0" y="0" width="130" height="42" rx="10" fill="#ffffff" />
      <text x="65" y="27" font-family="'Poppins', sans-serif" font-size="14" font-weight="bold" fill="#ee4d2d" text-anchor="middle">CASHBACK XTRA</text>
    </g>
  </g>
</svg>
